name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"
      - name: Test (sim)
        run: dotnet test sim/KbbqIdle.Sim.Tests/KbbqIdle.Sim.Tests.csproj

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -e ".[dev]"
      - name: Dependency check
        run: python -m pip check
      - name: Compile
        run: python -m compileall server
      - name: Test (server)
        run: python -m pytest server/tests -q

      - name: Generate backend review proof artifact
        run: python server/scripts/exercise_architecture_pack.py --output artifacts/kbbq-architecture-pack.json

      - name: Upload backend review proof artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kbbq-architecture-pack-proof
          path: artifacts/kbbq-architecture-pack.json

  review-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Deployment review gate
        run: bash tools/release_ops.sh check
