name: ci

on:
  push:
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test (sim)
        run: dotnet test sim/KbbqIdle.Sim.Tests/KbbqIdle.Sim.Tests.csproj

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -e ".[dev]"
      - name: Dependency check
        run: python -m pip check
      - name: Compile
        run: python -m compileall server
      - name: Test (server)
        run: python -m pytest server/tests -q

      - name: Generate backend review-pack proof artifact
        run: python server/scripts/exercise_review_pack.py --output artifacts/kbbq-review-pack.json

      - name: Upload backend review-pack artifact
        uses: actions/upload-artifact@v7
        with:
          name: kbbq-review-pack-proof
          path: artifacts/kbbq-review-pack.json

  review-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: AdSense/Cloudflare review gate
        run: bash tools/release_ops.sh check
