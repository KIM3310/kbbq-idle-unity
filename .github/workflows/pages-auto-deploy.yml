name: pages-auto-deploy

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "tools/cloudflare_pages.env"
      - ".github/workflows/pages-auto-deploy.yml"
  workflow_dispatch:

concurrency:
  group: pages-auto-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Skip deploy when Cloudflare secrets are missing
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "Cloudflare secrets are not configured; skipping Pages deploy."

      - name: Validate Cloudflare credentials
        id: cloudflare_auth
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        continue-on-error: true
        run: npx wrangler@4.66.0 whoami >/tmp/cf_auth.log 2>&1

      - name: Skip deploy when Cloudflare credentials are invalid
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && steps.cloudflare_auth.outcome == 'failure' }}
        run: |
          cat /tmp/cf_auth.log
          echo "Cloudflare credentials are invalid; skipping Pages deploy."

      - name: Deploy to Cloudflare Pages (retry)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && steps.cloudflare_auth.outcome == 'success' }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Deploy attempt $attempt/3"
            if npx wrangler@4.66.0 pages deploy docs --project-name=kbbq-idle-unity --branch=main --commit-dirty=true; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          echo "Cloudflare deploy failed after retries"
          exit 1
