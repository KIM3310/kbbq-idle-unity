name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    outputs:
      pages_configured: ${{ steps.configure_pages.outcome }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: configure_pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        continue-on-error: true
      - name: Skip deploy when GitHub Pages is not enabled
        if: ${{ steps.configure_pages.outcome == 'failure' }}
        run: echo "GitHub Pages is not enabled for this repository; skipping Pages deploy."
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: ${{ steps.configure_pages.outcome == 'success' }}
        with:
          path: docs

  deploy:
    name: Deploy GitHub Pages
    if: ${{ needs.build.outputs.pages_configured == 'success' }}
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
