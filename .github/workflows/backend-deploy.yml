name: backend-deploy

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kbbq-idle-api
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-remote:
    runs-on: ubuntu-latest
    needs: [build-image]
    env:
      KBBQ_DEPLOY_HOST: ${{ secrets.KBBQ_DEPLOY_HOST }}
      KBBQ_DEPLOY_USER: ${{ secrets.KBBQ_DEPLOY_USER }}
      KBBQ_DEPLOY_SSH_KEY: ${{ secrets.KBBQ_DEPLOY_SSH_KEY }}
      KBBQ_GHCR_USERNAME: ${{ secrets.KBBQ_GHCR_USERNAME }}
      KBBQ_GHCR_PAT: ${{ secrets.KBBQ_GHCR_PAT }}
    steps:
      - name: Check deploy configuration
        id: config
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing=0
          for key in KBBQ_DEPLOY_HOST KBBQ_DEPLOY_USER KBBQ_DEPLOY_SSH_KEY KBBQ_GHCR_USERNAME KBBQ_GHCR_PAT; do
            if [[ -z "${!key}" ]]; then
              echo "missing secret: $key"
              missing=1
            fi
          done

          if [[ "$missing" -eq 1 ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        if: steps.config.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.KBBQ_DEPLOY_HOST }}
          username: ${{ env.KBBQ_DEPLOY_USER }}
          key: ${{ env.KBBQ_DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            IMAGE="ghcr.io/${{ github.repository_owner }}/kbbq-idle-api:latest"
            docker login ghcr.io -u "${{ env.KBBQ_GHCR_USERNAME }}" -p "${{ env.KBBQ_GHCR_PAT }}"
            docker pull "$IMAGE"
            docker rm -f kbbq-api || true
            docker run -d \
              --name kbbq-api \
              --restart unless-stopped \
              --env-file /opt/kbbq/.env \
              -p 8000:8000 \
              "$IMAGE"
